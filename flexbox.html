<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Урок 7: Flexbox</title>
  <link rel="stylesheet" href="flexbox.css">
</head>
<body>
  <h1>Изучаем Flexbox</h1>

  <h2>Пример 1: Элементы в ряд</h2>
  <div class="container row">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <h2>Пример 2: По центру</h2>
  <div class="container center">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
  </div>

  <h2>Пример 3: Между элементами</h2>
  <div class="container between">
    <div class="box">X</div>
    <div class="box">Y</div>
    <div class="box">Z</div>
  </div>
</body>
</html>
